app = 'amuri-money'
primary_region = 'gru'

# Sem isso o deploy mata o processo em 5s, no meio das requests.
kill_timeout = '30s'

# Rede de segurança contra OOM: usa o disco que já existe, custo zero.
swap_size_mb = 512

[env]
  DATABASE_URL = 'file:/data/local.db'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

  # Sem health check o Fly só faz TCP-connect e não detecta processo travado.
  # /login é rota pública e barata.
  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    timeout = '10s'
    method = 'GET'
    path = '/login'

[[mounts]]
  source = 'amuri_data'
  destination = '/data'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
